workflows:
  ios-native-unsigned:
    name: iOS (unsigned)
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bump deployment target to iOS 12
        script: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.0/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' WeChat/WeChat.xcodeproj/project.pbxproj
          grep -m2 IPHONEOS_DEPLOYMENT_TARGET WeChat/WeChat.xcodeproj/project.pbxproj
      - name: Remove duplicate bundle resources (build fix)
        script: |
          # The 2020 project lists two identical icons_filled_chats.svg files and two
          # empty .gitkeep files in Copy Bundle Resources; Xcode 26 errors on the
          # duplicate outputs. The two SVGs are byte-identical and the .gitkeep files
          # are empty, so dropping the extra references changes nothing in the app.
          sed -i '' -e '/84AC07702482609F008D32F6/d' -e '/DE66C0E2246AE2A3000E9915/d' -e '/DE66C0EB246AE2A3000E9915/d' WeChat/WeChat.xcodeproj/project.pbxproj
          grep -c 'icons_filled_chats.svg in Resources' WeChat/WeChat.xcodeproj/project.pbxproj
          grep -c '\.gitkeep in Resources' WeChat/WeChat.xcodeproj/project.pbxproj || true
      - name: Install CocoaPods dependencies
        script: |
          cd WeChat && pod install --repo-update
      - name: Bump Pods deployment targets to iOS 12 (build fix)
        script: |
          # Pods targets are generated from the Podfile platform (iOS 8.0). Xcode 26.6
          # has no libarclite for iOS 8 targets, so linking fails with
          # "SDK does not contain 'libarclite'". Raising the generated Pods project
          # to 12.0 (checked-out copy only, repo source untouched) fixes it.
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 8\.0/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' WeChat/Pods/Pods.xcodeproj/project.pbxproj
          echo "remaining 8.0 targets:"; grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 8.0' WeChat/Pods/Pods.xcodeproj/project.pbxproj || true
          echo "targets now at 12.0:"; grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 12.0' WeChat/Pods/Pods.xcodeproj/project.pbxproj
      - name: Build iOS without code signing
        script: |
          xcodebuild -workspace WeChat/WeChat.xcworkspace \
            -scheme WeChat \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive -archivePath $CM_BUILD_DIR/WeChat.xcarchive
      - name: Package unsigned IPA
        script: |
          mkdir -p $CM_BUILD_DIR/Payload
          cp -r $CM_BUILD_DIR/WeChat.xcarchive/Products/Applications/WeChat.app $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR && zip -r WeChat-unsigned.ipa Payload
    artifacts:
      - WeChat-unsigned.ipa
